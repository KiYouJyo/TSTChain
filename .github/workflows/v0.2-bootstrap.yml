name: v0.2 Bootstrap

on:
  push:
    branches:
      - codex/v0.2-bootstrap
    paths:
      - "tools/.bootstrap_v0_2.py"
      - ".github/workflows/v0.2-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.2-bootstrap
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unpack v0.2 assets
        run: python tools/.bootstrap_v0_2.py
      - name: Install conformance dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run v0.1 regression
        run: python tools/v0_1_conformance.py
      - name: Run v0.2 conformance
        run: python tools/v0_2_conformance.py
      - name: Commit generated protocol assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/v0.2 examples/v0.2 test-vectors/v0.2 docs/*/TRUST-AUTHORITY.md locales requirements-dev.txt tools/v0_2_conformance.py .github/workflows/v0.2-conformance.yml
          git commit -m "feat(v0.2): implement trust and authority protocol"
          git push origin HEAD:codex/v0.2-bootstrap
