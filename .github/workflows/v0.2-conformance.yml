name: v0.2 Trust Authority Conformance

on:
  push:
    paths:
      - "schemas/v0.2/**"
      - "examples/v0.2/**"
      - "test-vectors/v0.2/**"
      - "docs/**/TRUST-AUTHORITY.md"
      - "locales/**"
      - "tools/v0_2_conformance.py"
      - "requirements-dev.txt"
      - "ROADMAP.md"
      - ".github/workflows/v0.2-conformance.yml"
  pull_request:
    paths:
      - "schemas/v0.2/**"
      - "examples/v0.2/**"
      - "test-vectors/v0.2/**"
      - "docs/**/TRUST-AUTHORITY.md"
      - "locales/**"
      - "tools/v0_2_conformance.py"
      - "requirements-dev.txt"
      - "ROADMAP.md"
      - ".github/workflows/v0.2-conformance.yml"

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/v0_1_conformance.py
      - run: python tools/v0_2_conformance.py
