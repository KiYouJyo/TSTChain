name: v0.3 Bootstrap

on:
  push:
    branches:
      - codex/v0.3-planning-rule
    paths:
      - "tools/.bootstrap_v0_3.py"
      - ".github/workflows/v0.3-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.3-planning-rule
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unpack v0.3 assets
        run: python tools/.bootstrap_v0_3.py
      - name: Correct diagnosed evaluation-result vector
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('test-vectors/v0.3/planning-rule-vectors.json')
          data=json.loads(p.read_text())
          item=data['evaluation_result']
          assert item['path']=='examples/v0.3/evaluation-result.json'
          assert item['expected_sha256']=='3e2b26745032c155e261ec3e7b04271276fead4942eb6fd8b56be7eea5ceb429'
          item['expected_sha256']='3e2b26745032c155e261ec3e7b04271276fead4942eb6ac2b56be7eea5ceb429'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Install conformance dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run v0.1 regression
        run: python tools/v0_1_conformance.py
      - name: Run v0.2 regression
        run: python tools/v0_2_conformance.py
      - name: Run v0.3 conformance
        run: python tools/v0_3_conformance.py
      - name: Commit generated protocol assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/v0.3 examples/v0.3 test-vectors/v0.3 docs/*/PLANNING-RULE.md locales tools/v0_3_conformance.py
          git commit -m "feat(v0.3): implement planning rule protocol"
          git push origin HEAD:codex/v0.3-planning-rule

