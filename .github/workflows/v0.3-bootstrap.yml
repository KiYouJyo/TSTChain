name: v0.3 Bootstrap

on:
  push:
    branches:
      - codex/v0.3-planning-rule
    paths:
      - "tools/.bootstrap_v0_3.py"
      - ".github/workflows/v0.3-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.3-planning-rule
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unpack v0.3 assets
        run: python tools/.bootstrap_v0_3.py
      - name: Install conformance dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run v0.1 regression
        run: python tools/v0_1_conformance.py
      - name: Run v0.2 regression
        run: python tools/v0_2_conformance.py
      - name: Diagnose every v0.3 hash vector
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import tools.v0_3_conformance as c
          vectors=json.loads(Path('test-vectors/v0.3/planning-rule-vectors.json').read_text())
          def walk(value, keypath='root'):
              if isinstance(value, dict):
                  if isinstance(value.get('path'), str) and isinstance(value.get('expected_sha256'), str):
                      path=value['path']
                      actual=c.sha256_hex(json.loads(Path(path).read_text()))
                      state='OK' if actual==value['expected_sha256'] else 'MISMATCH'
                      print(f"{keypath}: {path} actual={actual} expected={value['expected_sha256']} {state}")
                  for k,v in value.items(): walk(v, f'{keypath}.{k}')
              elif isinstance(value, list):
                  for i,v in enumerate(value): walk(v, f'{keypath}[{i}]')
          walk(vectors)
          PY
      - name: Run v0.3 conformance
        run: python tools/v0_3_conformance.py
      - name: Commit generated protocol assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/v0.3 examples/v0.3 test-vectors/v0.3 docs/*/PLANNING-RULE.md locales tools/v0_3_conformance.py
          git commit -m "feat(v0.3): implement planning rule protocol"
          git push origin HEAD:codex/v0.3-planning-rule

